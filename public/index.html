      setupPositionProbePattern(_moduleCount - 7, 0);

      setupTimingPattern();

        if (i == 0 || minLostPoint > lostPoint) {

      for (var r = 8; r < _moduleCount - 8; r += 1) {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {

      var bits = QRUtil.getBCHTypeInfo(data);

        var mod = (!test && ( (bits >> i) & 1) == 1);

        } else {

      for (var i = 0; i < 15; i += 1) {

        } else {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var max = size - margin;

      var max = size - margin;

      var bin = base64DecodeInputStream(unicodeData);

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b);
            } else {

              bytes.push(b & 0xff);
            }

          }
        }
      }
      return bytes;
    };

<style>
  :root{
    --teal:#0E6654;
    --teal-dark:#0A4E40;
    --teal-light:#E6F2EF;
    --red:#C0392B;
    --red-light:#FDECEA;
    --amber:#B7791F;
    --amber-light:#FEF6E7;
    --green:#1E8E5A;
    --green-light:#EAF7EF;
    --gray-bg:#F4F6F5;
    --border:#DCE3E0;
    --text:#1F2A26;
    --text-mute:#5C6B65;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gray-bg);color:var(--text);}
  header.appbar{background:var(--teal);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header.appbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  header.appbar .brand .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
  header.appbar .brand .title{font-weight:700;font-size:17px;line-height:1.1;}
  header.appbar .brand .subtitle{font-size:11px;opacity:.85;}
  header.appbar .navbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;}
  header.appbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;}
  header.appbar button:hover{background:rgba(255,255,255,.28);}
  header.appbar .whoami{font-size:12px;opacity:.9;margin-right:4px;white-space:nowrap;}
  header.appbar .locpicker{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 8px;border-radius:8px;font-size:12.5px;margin-right:2px;width:auto;}
  header.appbar .locpicker option{color:#1F2A26;}
  @media(max-width:640px){
    header.appbar{padding:10px 12px;}
    header.appbar .navbtns{width:100%;justify-content:flex-start;gap:6px;}
    header.appbar button{padding:7px 10px;font-size:12.5px;}
    header.appbar .whoami{width:100%;}
  }
  main{max-width:900px;margin:0 auto;padding:16px;padding-bottom:80px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .hero{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border-radius:14px;padding:20px;margin-bottom:18px;}
  .hero h1{margin:0 0 6px;font-size:20px;}
  .hero p{margin:0;opacity:.9;font-size:14px;}
  .searchbox{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:15px;margin-bottom:14px;background:#fff;}
  .formlist{display:flex;flex-direction:column;gap:10px;}
  .formitem{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .formitem:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(14,102,84,.12);}
  .formitem .fi-left{display:flex;align-items:center;gap:12px;}
  .formitem .fi-icon{width:40px;height:40px;border-radius:10px;background:var(--teal-light);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .formitem .fi-title{font-weight:600;font-size:15px;}
  .formitem .fi-meta{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .formitem .fi-lastinspected{font-size:11.5px;color:var(--text-mute);margin-top:3px;}
  .formitem .fi-arrow{color:var(--text-mute);font-size:18px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .badge.zone{background:var(--teal-light);color:var(--teal-dark);}
  .badge.equip{background:var(--amber-light);color:var(--amber);}
  .badge.machine{background:#EFEAFB;color:#5B3EC9;}
  .sectiontitle{font-weight:700;font-size:16px;margin:22px 0 10px;color:var(--teal-dark);border-bottom:2px solid var(--teal-light);padding-bottom:6px;}
  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media(max-width:600px){.fieldrow{grid-template-columns:1fr;}}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
  input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:#fff;color:var(--text);font-family:inherit;}
  textarea{resize:vertical;min-height:40px;}
  .itemrow{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;}
  .itemrow .itemlabel{font-size:14.5px;font-weight:600;margin-bottom:8px;}
  .itemrow .itemsop{font-size:11.5px;color:var(--text-mute);margin-top:-4px;margin-bottom:8px;font-style:italic;}
  .statusbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .statusbtn{flex:1;min-width:90px;padding:10px 8px;text-align:center;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-mute);}
  .statusbtn.ok.active{background:var(--green-light);border-color:var(--green);color:var(--green);}
  .statusbtn.attn.active{background:var(--red-light);border-color:var(--red);color:var(--red);}
  .statusbtn.na.active{background:#EEE;border-color:#999;color:#555;}
  .itemrow.flagged{border-color:var(--red);background:var(--red-light);}
  .commentbox{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;margin-top:2px;}
  .itemtools{display:flex;gap:8px;margin-bottom:8px;}
  .toolbtn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-mute);cursor:pointer;}
  .toolbtn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .photostrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .phothumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#eee;}
  .phothumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .phothumb.uploading img{opacity:.5;}
  .phothumb.photoerror{border-color:var(--red);}
  .phostatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px;}
  .phostatus.err{background:rgba(192,57,43,.75);cursor:pointer;}
  .photoremove{position:absolute;top:1px;right:3px;color:#fff;background:rgba(0,0,0,.5);border-radius:50%;width:16px;height:16px;font-size:12px;line-height:16px;text-align:center;cursor:pointer;font-weight:800;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:9px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--teal);color:#fff;}
  .btn.primary:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
  .btn.ghost{background:transparent;color:var(--text-mute);border:1px solid var(--border);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .actionbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
  .radiogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .langtoggle{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  .langtoggle button{border:none;background:#fff;padding:7px 16px;font-size:13px;font-weight:700;color:var(--text-mute);cursor:pointer;}
  .langtoggle button.active{background:var(--teal);color:#fff;}
  @media(max-width:500px){.radiogrid{grid-template-columns:1fr;}}
  .radiocard{border:2px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-weight:700;font-size:13.5px;cursor:pointer;}
  .radiocard.active{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark);}
  .caltable{width:100%;border-collapse:collapse;font-size:13px;}
  .caltable th,.caltable td{border:1px solid var(--border);padding:6px;text-align:left;}
  .caltable th{background:var(--gray-bg);font-size:11px;text-transform:uppercase;color:var(--text-mute);}
  .caltable input{border:none;padding:4px;font-size:13px;width:100%;background:transparent;}
  .rowremove{color:var(--red);cursor:pointer;font-size:16px;font-weight:800;padding:0 6px;}
  .safetylist{list-style:none;padding:0;margin:0;}
  .safetylist li{padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--border);font-size:14.5px;line-height:1.4;}
  .safetylist li:before{content:"✓";position:absolute;left:0;top:10px;color:var(--teal);font-weight:800;}
  .safetylist li:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty{text-align:center;color:var(--text-mute);padding:40px 20px;}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .pill.Satisfactory{background:var(--green-light);color:var(--green);}
  .pill.MinorIssuesNoted{background:var(--amber-light);color:var(--amber);}
  .pill.CorrectiveActionRequired{background:var(--red-light);color:var(--red);}
  .pill.ReInspectionRequired{background:var(--red-light);color:var(--red);}
  .histitem{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .histitem:hover{border-color:var(--teal);}
  .histitem .h-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;}
  .histprintbtn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer;line-height:1;}
  .histprintbtn:hover{border-color:var(--teal);background:var(--teal-light);}
  .histitem .h-meta{font-size:12px;color:var(--text-mute);margin-top:4px;}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select,.filterbar input{padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;}
  .loginwrap{max-width:380px;margin:60px auto;text-align:center;}
  .loginwrap .logo{width:64px;height:64px;border-radius:16px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center;}
  .spinner{width:34px;height:34px;border:4px solid var(--teal-light);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px;margin-bottom:16px;}
  .detailgrid div b{display:block;font-size:11px;color:var(--text-mute);text-transform:uppercase;}
  .print-only{display:none;}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .qrcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .qrcanvaswrap{display:flex;justify-content:center;margin-bottom:10px;}
  .qrcanvaswrap canvas,.qrcanvaswrap img{max-width:100%;height:auto;}
  .qrform{font-weight:800;font-size:17px;}
  .qrmachine{font-size:14px;color:var(--text-mute);margin-top:2px;}
  @media print{
    header.appbar,.actionbar,.filterbar,.backlink,.btn,.hero p{display:none!important;}
    body{background:#fff;}
    .print-only{display:block;}
    .qrgrid{grid-template-columns:repeat(2,1fr);}
    .qrcard{break-inside:avoid;border:1px dashed #999;}
  }
</style>

function getFormSafe(id){ return FORMS.find(f => f.id === id) || null; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function getForm(id){ return FORMS.find(f => f.id === id); }

function badgeFor(f){
  if (f.template === 'zone') return '<span class="badge zone">Area Inspection</span>';
  if (f.template === 'ladder' || f.template === 'equipment') return '<span class="badge equip">Equipment Check</span>';
  if (f.template === 'machine') return '<span class="badge machine">Monthly Acknowledgment</span>';
  return '';
}
function iconFor(f){ return f.icon || '📋'; }

// ---------- fresh answer scaffolding ----------
function blankZoneOrEquipData(f, sectionsOverride){
  const sections = sectionsOverride || f.sections;
  const items = {};
  sections.forEach(sec => {
    sec.items.forEach(it => {
      items[sec.title + '||' + it.label] = { status: null, comment: '', photos: [] };
    });
  });
  return {
    inspectedBy: state.employeeName,
    dateInspected: todayStr(),
    header: {},
    items: items,
    correctiveActions: [],
    overallResult: null,
    lang: localStorage.getItem('gwpg_st_lang') || 'en'
  };
}
function blankMachineData(f){
  return {
    employeeName: '',
    shift: '',
    department: f.dept,
    machine: f.machine,
    employeeSignatureDataUrl: '',
    supervisorSignature: '',
    ackDate: todayStr(),
    lang: localStorage.getItem('gwpg_st_lang') || 'en'
  };
}

function startForm(id){
  const f = getForm(id);
  if (!f) return;
  state.activeFormId = id;
  if (f.template === 'zone' || f.template === 'equipment') {
    state.formData = blankZoneOrEquipData(f);
  } else if (f.template === 'ladder') {
    state.formData = blankZoneOrEquipData(f, []);
    state.formData.header[f.typeKey] = '';
  } else if (f.template === 'machine') {
    state.formData = blankMachineData(f);
  }
  state.screen = 'form';
  render();
  window.scrollTo(0,0);
}

  const app = document.getElementById('app');
  app.innerHTML = headerHtml() + '<main>' + screenHtml() + '</main>';

  if (state.screen === 'home') return homeHtml();
  if (state.screen === 'form') return formHtml();
  if (state.screen === 'history') return historyHtml();
  if (state.screen === 'detail') return detailHtml();
  if (state.screen === 'openitems') return openItemsHtml();
  if (state.screen === 'qrcodes') return qrCodesHtml();
  return homeHtml();

  localStorage.removeItem('gwpg_st_name');

function submitName(){
  const v = document.getElementById('nameInput').value.trim();
  const locInput = document.getElementById('locationInput');
  const loc = locInput ? locInput.value : state.location;
  if (!v) { showToast('Please enter your name'); return; }
  if (!loc) { showToast('Please select your location'); return; }
  state.employeeName = v;
  state.location = loc;
  localStorage.setItem('gwpg_st_name', v);
  localStorage.setItem('gwpg_st_location', loc);
  state.historyLoaded = false;
  loadHistoryIfNeeded();
  if (state.pendingQrForm) {
    const formId = state.pendingQrForm;
    state.pendingQrForm = null;
    startForm(formId);
  } else {
    render();
  }
}

function lastInspectedMap(){
  const map = {};
  state.historyItems.forEach(i => {
    if (i.location && i.location !== state.location) return;
    const ts = i.submittedAtLocal || i.submittedAt;
    if (!ts) return;
    if (!map[i.formId] || ts > map[i.formId]) map[i.formId] = ts;
  });
  return map;
}

function timeAgo(iso){
  const then = new Date(iso).getTime();
  if (isNaN(then)) return '';
  const diffMs = Date.now() - then;
  const day = 86400000;
  if (diffMs < 0) return new Date(iso).toLocaleDateString();
  if (diffMs < day) {
    const hrs = Math.floor(diffMs / 3600000);
    if (hrs < 1) return 'Just now';
    return hrs === 1 ? '1 hour ago' : hrs + ' hours ago';
  }
  const days = Math.floor(diffMs / day);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 30) { const w = Math.floor(days/7); return w === 1 ? '1 week ago' : w + ' weeks ago'; }
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

    <h1>Safety Checklists</h1>

        <div class="fi-arrow">›</div>
      </div>`).join('')}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1280;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhotoInputChange(key, inputEl){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = ''; // allow re-selecting the same file later
  if (!file) return;
  const rec = state.formData.items[key];
  if (!rec.photos) rec.photos = [];
  const f = getForm(state.activeFormId);
  const zt = ZONE_UI[f ? zoneLang(f) : 'en'];
  if (rec.photos.length >= 3) { showToast(zt.upTo3Photos); return; }
  let dataUrl;
  try {
    dataUrl = await compressImage(file);
  } catch (e) {
    showToast(zt.couldNotReadPhoto); return;
  }
  const photo = { dataUrl, uploading: true };
  rec.photos.push(photo);
  render();
  try {
    const res = await fetch('/api/photos', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ imageBase64: dataUrl })
    });
    if (!res.ok) throw new Error('upload failed: ' + res.status);
    const { key: photoKey } = await res.json();
    photo.key = photoKey;
    photo.uploading = false;
  } catch (e) {
    console.error(e);
    photo.uploading = false;
    photo.error = true;
  }
  render();
}

// ---------- submit ----------
async function submitForm(){
  const f = getForm(state.activeFormId);
  if (!f) return;
  const d = state.formData;
  const zt = ZONE_UI[zoneLang(f)];

  if (f.template === 'machine') {
    const t = MACHINE_UI[d.lang || 'en'];
    if (!d.employeeName || !d.employeeName.trim()) { showToast(t.pleaseEnterName); return; }
    if (!d.employeeSignatureDataUrl) { showToast(t.pleaseSign); return; }
  } else {
    if (!d.overallResult) { showToast(zt.pleaseSelectResult); return; }
    const stillUploading = Object.values(d.items || {}).some(r => (r.photos||[]).some(p => p.uploading));
    if (stillUploading) { showToast(zt.stillUploading); return; }
  }

  // strip local-only preview data before saving; keep only successfully uploaded photo keys
  const cleanData = JSON.parse(JSON.stringify(d));
  if (cleanData.items) {
    Object.values(cleanData.items).forEach(r => {
      r.photos = (r.photos || []).filter(p => p.key).map(p => ({ key: p.key }));
    });
  }

  const payload = {
    formId: f.id,
    formTitle: f.title,
    formCode: f.code,
    template: f.template,
    department: f.dept || d.department || '',
    location: state.location,
    employeeName: state.employeeName,
    submittedAtLocal: new Date().toISOString(),
    data: cleanData
  };

  state.saving = true;
  const savingMsg = f.template === 'machine' ? MACHINE_UI[d.lang||'en'].savingText : zt.savingText;
  const submittedMsg = f.template === 'machine' ? MACHINE_UI[d.lang||'en'].submittedText : zt.submittedText;
  showToast(savingMsg);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    showToast(submittedMsg);
    state.activeFormId = null;
    state.screen = 'home';
    state.historyLoaded = false;
    render();
    loadHistoryIfNeeded();
  } catch (e) {
    console.error(e);
    showToast('Save failed — check connection and try again');
  }
  state.saving = false;
}

function collectOpenItems(){
  // Every flagged ("Needs Attention") item across recent submissions, newest first.
  // Read-only view — there's no resolve/close workflow, so this reflects what was
  // flagged at submission time, not necessarily what's still unresolved today.
  const rows = [];
  state.historyItems.forEach(sub => {
    if (sub.template === 'machine') return; // machine acknowledgments never have flagged items
    const items = (sub.data && sub.data.items) || {};
    Object.keys(items).forEach(k => {
      if (items[k].status !== 'ATTN') return;
      rows.push({
        submissionId: sub.id,
        formId: sub.formId,
        formTitle: sub.formTitle,
        location: sub.location,
        employeeName: sub.employeeName,
        submittedAtLocal: sub.submittedAtLocal,
        itemKey: k,
        comment: items[k].comment,
        photos: items[k].photos || []
      });
    });
  });
  rows.sort((a,b) => (b.submittedAtLocal||'').localeCompare(a.submittedAtLocal||''));
  return rows;
}

function qrLinkFor(f){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('form', f.id);
  if (f.location) url.searchParams.set('loc', f.location);
  return url.toString();
}

function qrDataUrl(text){
  try {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const cellSize = 6, margin = 8;
    const count = qr.getModuleCount();
    const size = count * cellSize + margin * 2;
    let path = '';
    for (let r = 0; r < count; r++) {
      const my = r * cellSize + margin;
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          const mx = c * cellSize + margin;
          path += `M${mx},${my}h${cellSize}v${cellSize}h-${cellSize}z `;
        }
      }
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="#FDECEA"/><path d="${path}" fill="#1A1A1A"/></svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  } catch (e) {
    console.error('QR generation failed', e);
    return '';
  }
}

    const q = state.historySearch.toLowerCase();
    items = items.filter(i => (i.employeeName||'').toLowerCase().includes(q));
  }
  return `
  <div class="filterbar">
    <select id="histLocationFilter" onchange="setHistLocationFilter(this.value)">
      <option value="all">All locations</option>
      ${LOCATIONS.map(l => `<option value="${esc(l)}" ${state.historyFilterLocation===l?'selected':''}>${esc(l)}</option>`).join('')}
    </select>
    <select id="histFormFilter" onchange="setHistFilter(this.value)">
      <option value="all">All checklists</option>
      ${formOptions}
    </select>
    <input type="text" id="histSearch" placeholder="Search by employee..." value="${esc(state.historySearch)}" oninput="setHistSearch(this.value)">
    <button class="btn ghost" onclick="exportHistoryCsv()">Export CSV</button>
  </div>
  ${items.length === 0 ? `<div class="empty">No submissions found.</div>` : items.map(i => histItemHtml(i)).join('')}
  `;
}
function setHistFilter(v){ state.historyFilterForm = v; render(); }
function setHistLocationFilter(v){ state.historyFilterLocation = v; render(); }
function setHistSearch(v){ state.historySearch = v; render(); }

function histItemHtml(i){
  const result = i.data && i.data.overallResult;
  const dt = i.submittedAtLocal ? new Date(i.submittedAtLocal).toLocaleString() : '';
  return `
  <div class="histitem" onclick="openDetail('${i.id}', 'history')">
    <div class="h-top">
      <span>${esc(i.formTitle)}</span>
      <span style="display:flex;align-items:center;gap:8px;">
        ${result ? `<span class="pill ${result}">${esc(RESULT_OPTIONS.find(r=>r.key===result)?.label || result)}</span>` : (i.template==='machine' ? '<span class="pill Satisfactory">Acknowledged</span>' : '')}
        <button type="button" class="histprintbtn" title="Print" onclick="printSubmission('${escJs(i.id)}', event)">🖨️</button>
      </span>
    </div>
    <div class="h-meta">${esc(i.employeeName)}${i.location ? ' &middot; 📍 ' + esc(i.location) : ''} &middot; ${esc(dt)}</div>
  </div>`;
}

function printSubmission(id, evt){
  if (evt) evt.stopPropagation();
  const item = state.historyItems.find(i => i.id === id);
  if (!item) return;
  state.detailItem = item;
  state.detailFrom = 'history';
  state.screen = 'detail';
  render();
  setTimeout(() => window.print(), 250);
}

function openDetail(id, fromScreen){
  state.detailItem = state.historyItems.find(i => i.id === id);
  state.detailFrom = fromScreen || 'history';
  state.screen = 'detail';
  render();
  window.scrollTo(0,0);
}

function detailItemLineHtml(k, rec, labelResolver){
  const photos = rec.photos || [];
  const label = labelResolver ? labelResolver(k) : k.split('||')[1];
  return `<li>
    <b>${esc(label)}</b>${rec.comment ? ' — ' + esc(rec.comment) : ''}
    ${photos.length ? `<div class="photostrip" style="margin-top:6px;">${photos.map(p => `
      <a href="/api/photos/${esc(p.key)}" target="_blank"><div class="phothumb"><img src="/api/photos/${esc(p.key)}"></div></a>
    `).join('')}</div>` : ''}
  </li>`;
}

function detailHtml(){
  const i = state.detailItem;
  if (!i) return '<div class="empty">Not found.</div>';
  const f = getForm(i.formId);
  let body = '';
  if (i.template === 'machine') {
    const lang = (i.data && i.data.lang) || 'en';
    const t = MACHINE_UI[lang];
    const steps = f ? (lang === 'es' ? (f.stepsEs || f.steps) : f.steps) : [];
    body = `
    <div class="detailgrid">
      <div><b>Employee</b>${esc(i.data.employeeName)}</div>
      <div><b>Shift</b>${esc(i.data.shift)}</div>
      <div><b>Machine</b>${esc(i.data.machine)}</div>
      <div><b>Date</b>${esc(i.data.ackDate)}</div>
      <div><b>Supervisor Signature (Optional)</b>${esc(i.data.supervisorSignature||'—')}</div>
      <div><b>Language</b>${lang === 'es' ? 'Español' : 'English'}</div>
    </div>
    ${i.data.employeeSignatureDataUrl ? `
      <div class="sectiontitle" style="margin-top:16px;">${t.employeeSignatureLabel.split(' (')[0]}</div>
      <img src="${esc(i.data.employeeSignatureDataUrl)}" style="max-width:320px;border:1px solid var(--border);border-radius:8px;background:#fff;">` : ''}
    <div class="sectiontitle">${t.safetyDescription}</div>
    <ul class="safetylist">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  } else {
    const items = i.data.items || {};
    const lang = (f && f.bilingual && i.data.lang === 'es') ? 'es' : 'en';
    const t = ZONE_UI[lang];
    const findItemLabel = (key) => {
      if (!f) return key.split('||')[1];
      const [secTitle, itLabel] = key.split('||');
      const sec = (f.sections || []).find(s => s.title === secTitle);
      const it = sec && sec.items.find(x => x.label === itLabel);
      if (!it) return itLabel;
      return (lang === 'es' && it.label_es) ? it.label_es : it.label;
    };
    const findHeaderLabel = (key) => {
      const hf = f && (f.headerFields || []).find(h => h.key === key);
      if (!hf) return key;
      return (lang === 'es' && hf.label_es) ? hf.label_es : hf.label;
    };
    const attnKeys = Object.keys(items).filter(k => items[k].status === 'ATTN');
    const notedKeys = Object.keys(items).filter(k => items[k].status !== 'ATTN' && (items[k].comment || (items[k].photos||[]).length));
    body = `
    <div class="detailgrid">
      <div><b>${t.inspectedBy}</b>${esc(i.data.inspectedBy)}</div>
      <div><b>${t.dateInspected}</b>${esc(i.data.dateInspected)}</div>
      ${Object.entries(i.data.header||{}).map(([k,v])=>`<div><b>${esc(findHeaderLabel(k))}</b>${esc(v)}</div>`).join('')}
      <div><b>${t.overallResultTitle}</b>${esc(RESULT_OPTIONS.find(r=>r.key===i.data.overallResult)?.label || '')}</div>
    </div>
    ${attnKeys.length ? `
      <div class="sectiontitle">${lang==='es' ? 'Artículos que Necesitan Atención' : 'Items Needing Attention'}</div>
      <ul class="safetylist">
        ${attnKeys.map(k => detailItemLineHtml(k, items[k], findItemLabel)).join('')}
      </ul>` : `<p style="color:var(--text-mute);">${lang==='es' ? 'Ningún artículo fue marcado como Necesita Atención.' : 'No items were flagged as Needs Attention.'}</p>`}
    ${notedKeys.length ? `
      <div class="sectiontitle">${lang==='es' ? 'Otras Notas' : 'Other Notes'}</div>
      <ul class="safetylist">
        ${notedKeys.map(k => detailItemLineHtml(k, items[k], findItemLabel)).join('')}
      </ul>` : ''}
    ${(i.data.correctiveActions||[]).length ? `
      <div class="sectiontitle">${t.correctiveLogTitle}</div>
      <table class="caltable">
        <tr><th>${t.colItemArea}</th><th>${t.colActionNeeded}</th><th>${t.colAssignedTo}</th><th>${t.colDueDate}</th></tr>
        ${i.data.correctiveActions.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.action)}</td><td>${esc(r.assignedTo)}</td><td>${esc(r.dueDate)}</td></tr>`).join('')}
      </table>` : ''}`;
  }
  return `
  <div class="backlink" onclick="state.screen=state.detailFrom||'history';render();">‹ Back to ${state.detailFrom==='openitems' ? 'Open Items' : 'history'}</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h2 style="margin:0 0 4px;">${esc(i.formTitle)}</h2>
        <div style="font-size:12.5px;color:var(--text-mute);">${esc(i.formCode)} &middot; Submitted by ${esc(i.employeeName)}${i.location ? ' &middot; 📍 ' + esc(i.location) : ''}</div>
      </div>
      <button class="btn ghost" onclick="window.print()">Print</button>
    </div>
  </div>
  <div class="card">${body}</div>`;
}

function exportHistoryCsv(){
  let items = state.historyItems;
  if (state.historyFilterLocation !== 'all') items = items.filter(i => i.location === state.historyFilterLocation);
  if (state.historyFilterForm !== 'all') items = items.filter(i => i.formId === state.historyFilterForm);
  if (state.historySearch) {
    const q = state.historySearch.toLowerCase();
    items = items.filter(i => (i.employeeName||'').toLowerCase().includes(q));
  }
  const rows = [['Form','Code','Location','Employee','Submitted','Overall Result']];
  items.forEach(i => {
    rows.push([
      i.formTitle, i.formCode, i.location || '', i.employeeName,
      i.submittedAtLocal ? new Date(i.submittedAtLocal).toLocaleString() : '',
      i.data && i.data.overallResult ? (RESULT_OPTIONS.find(r=>r.key===i.data.overallResult)?.label||'') : (i.template==='machine'?'Acknowledged':'')
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'safetytrack-history-' + todayStr() + '.csv';
  a.click();
}

function wireEvents(){
  const s = document.getElementById('searchInput');
  if (s) s.oninput = (e) => { state.search = e.target.value; render(); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
  const sig = document.getElementById('sigCanvas');
  if (sig) initSignaturePad(sig);
}

function initSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1F2A26';

  const existing = state.formData.employeeSignatureDataUrl;
  if (existing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = existing;
  }

  let drawing = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function start(e){
    drawing = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function move(e){
    if (!drawing) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  }
  function end(){
    if (!drawing) return;
    drawing = false;
    state.formData.employeeSignatureDataUrl = canvas.toDataURL('image/png');
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
}

function clearSignature(){
  const canvas = document.getElementById('sigCanvas');
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  state.formData.employeeSignatureDataUrl = '';
}

// If a QR code linked straight to a form and we already know who's using this
// device, skip the home list entirely and jump right into that checklist.
if (state.pendingQrForm && state.employeeName && state.location) {
  const qrFormId = state.pendingQrForm;
  state.pendingQrForm = null;
  startForm(qrFormId);
} else {
  render();
}
if (state.employeeName) loadHistoryIfNeeded();
</script>
