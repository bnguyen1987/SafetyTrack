<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>GWPG SafetyTrack</title>
<style>
  :root{
    --teal:#0E6654;
    --teal-dark:#0A4E40;
    --teal-light:#E6F2EF;
    --red:#C0392B;
    --red-light:#FDECEA;
    --amber:#B7791F;
    --amber-light:#FEF6E7;
    --green:#1E8E5A;
    --green-light:#EAF7EF;
    --gray-bg:#F4F6F5;
    --border:#DCE3E0;
    --text:#1F2A26;
    --text-mute:#5C6B65;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gray-bg);color:var(--text);}
  header.appbar{background:var(--teal);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header.appbar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  header.appbar .brand .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  header.appbar .brand .title{font-weight:700;font-size:17px;line-height:1.1;}
  header.appbar .brand .subtitle{font-size:11px;opacity:.85;}
  header.appbar .navbtns{display:flex;gap:8px;align-items:center;}
  header.appbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
  header.appbar button:hover{background:rgba(255,255,255,.28);}
  header.appbar .whoami{font-size:12px;opacity:.9;margin-right:4px;}
  main{max-width:900px;margin:0 auto;padding:16px;padding-bottom:80px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .hero{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border-radius:14px;padding:20px;margin-bottom:18px;}
  .hero h1{margin:0 0 6px;font-size:20px;}
  .hero p{margin:0;opacity:.9;font-size:14px;}
  .searchbox{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:15px;margin-bottom:14px;background:#fff;}
  .formlist{display:flex;flex-direction:column;gap:10px;}
  .formitem{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .formitem:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(14,102,84,.12);}
  .formitem .fi-left{display:flex;align-items:center;gap:12px;}
  .formitem .fi-icon{width:40px;height:40px;border-radius:10px;background:var(--teal-light);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .formitem .fi-title{font-weight:600;font-size:15px;}
  .formitem .fi-meta{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .formitem .fi-lastinspected{font-size:11.5px;color:var(--text-mute);margin-top:3px;}
  .formitem .fi-arrow{color:var(--text-mute);font-size:18px;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .badge.zone{background:var(--teal-light);color:var(--teal-dark);}
  .badge.equip{background:var(--amber-light);color:var(--amber);}
  .badge.machine{background:#EFEAFB;color:#5B3EC9;}
  .sectiontitle{font-weight:700;font-size:16px;margin:22px 0 10px;color:var(--teal-dark);border-bottom:2px solid var(--teal-light);padding-bottom:6px;}
  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media(max-width:600px){.fieldrow{grid-template-columns:1fr;}}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
  input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:#fff;color:var(--text);font-family:inherit;}
  textarea{resize:vertical;min-height:40px;}
  .itemrow{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;}
  .itemrow .itemlabel{font-size:14.5px;font-weight:600;margin-bottom:8px;}
  .itemrow .itemsop{font-size:11.5px;color:var(--text-mute);margin-top:-4px;margin-bottom:8px;font-style:italic;}
  .statusbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .statusbtn{flex:1;min-width:90px;padding:10px 8px;text-align:center;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-mute);}
  .statusbtn.ok.active{background:var(--green-light);border-color:var(--green);color:var(--green);}
  .statusbtn.attn.active{background:var(--red-light);border-color:var(--red);color:var(--red);}
  .statusbtn.na.active{background:#EEE;border-color:#999;color:#555;}
  .itemrow.flagged{border-color:var(--red);background:var(--red-light);}
  .commentbox{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;margin-top:2px;}
  .itemtools{display:flex;gap:8px;margin-bottom:8px;}
  .toolbtn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-mute);cursor:pointer;}
  .toolbtn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .photostrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .phothumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#eee;}
  .phothumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .phothumb.uploading img{opacity:.5;}
  .phothumb.photoerror{border-color:var(--red);}
  .phostatus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px;}
  .phostatus.err{background:rgba(192,57,43,.75);cursor:pointer;}
  .photoremove{position:absolute;top:1px;right:3px;color:#fff;background:rgba(0,0,0,.5);border-radius:50%;width:16px;height:16px;font-size:12px;line-height:16px;text-align:center;cursor:pointer;font-weight:800;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:9px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--teal);color:#fff;}
  .btn.primary:hover{background:var(--teal-dark);}
  .btn.secondary{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
  .btn.ghost{background:transparent;color:var(--text-mute);border:1px solid var(--border);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .actionbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
  .radiogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(max-width:500px){.radiogrid{grid-template-columns:1fr;}}
  .radiocard{border:2px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-weight:700;font-size:13.5px;cursor:pointer;}
  .radiocard.active{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark);}
  .caltable{width:100%;border-collapse:collapse;font-size:13px;}
  .caltable th,.caltable td{border:1px solid var(--border);padding:6px;text-align:left;}
  .caltable th{background:var(--gray-bg);font-size:11px;text-transform:uppercase;color:var(--text-mute);}
  .caltable input{border:none;padding:4px;font-size:13px;width:100%;background:transparent;}
  .rowremove{color:var(--red);cursor:pointer;font-size:16px;font-weight:800;padding:0 6px;}
  .safetylist{list-style:none;padding:0;margin:0;}
  .safetylist li{padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--border);font-size:14.5px;line-height:1.4;}
  .safetylist li:before{content:"✓";position:absolute;left:0;top:10px;color:var(--teal);font-weight:800;}
  .safetylist li:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty{text-align:center;color:var(--text-mute);padding:40px 20px;}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:14px;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .pill.Satisfactory{background:var(--green-light);color:var(--green);}
  .pill.MinorIssuesNoted{background:var(--amber-light);color:var(--amber);}
  .pill.CorrectiveActionRequired{background:var(--red-light);color:var(--red);}
  .pill.ReInspectionRequired{background:var(--red-light);color:var(--red);}
  .histitem{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .histitem:hover{border-color:var(--teal);}
  .histitem .h-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;}
  .histitem .h-meta{font-size:12px;color:var(--text-mute);margin-top:4px;}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select,.filterbar input{padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;}
  .loginwrap{max-width:380px;margin:60px auto;text-align:center;}
  .loginwrap .logo{width:64px;height:64px;border-radius:16px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;text-align:center;}
  .spinner{width:34px;height:34px;border:4px solid var(--teal-light);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px;margin-bottom:16px;}
  .detailgrid div b{display:block;font-size:11px;color:var(--text-mute);text-transform:uppercase;}
  .print-only{display:none;}
  @media print{
    header.appbar,.actionbar,.filterbar,.backlink,.btn{display:none!important;}
    body{background:#fff;}
    .print-only{display:block;}
  }
</style>
</head>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function getForm(id){ return FORMS.find(f => f.id === id); }

function badgeFor(f){
  if (f.template === 'zone') return '<span class="badge zone">Area Inspection</span>';
  if (f.template === 'ladder' || f.template === 'equipment') return '<span class="badge equip">Equipment Check</span>';
  if (f.template === 'machine') return '<span class="badge machine">Monthly Acknowledgment</span>';
  return '';

function timeAgo(iso){
  const then = new Date(iso).getTime();
  if (isNaN(then)) return '';
  const diffMs = Date.now() - then;
  const day = 86400000;
  if (diffMs < 0) return new Date(iso).toLocaleDateString();
  if (diffMs < day) {
    const hrs = Math.floor(diffMs / 3600000);
    if (hrs < 1) return 'Just now';
    return hrs === 1 ? '1 hour ago' : hrs + ' hours ago';
  }
  const days = Math.floor(diffMs / day);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 30) { const w = Math.floor(days/7); return w === 1 ? '1 week ago' : w + ' weeks ago'; }
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1280;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function onPhotoInputChange(key, inputEl){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = ''; // allow re-selecting the same file later
  if (!file) return;
  const rec = state.formData.items[key];
  if (!rec.photos) rec.photos = [];
  if (rec.photos.length >= 3) { showToast('Up to 3 photos per item'); return; }
  let dataUrl;
  try {
    dataUrl = await compressImage(file);
  } catch (e) {
    showToast('Could not read that photo'); return;
  }
  const photo = { dataUrl, uploading: true };
  rec.photos.push(photo);
  render();
  try {
    const res = await fetch('/api/photos', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ imageBase64: dataUrl })
    });
    if (!res.ok) throw new Error('upload failed: ' + res.status);
    const { key: photoKey } = await res.json();
    photo.key = photoKey;
    photo.uploading = false;
  } catch (e) {
    console.error(e);
    photo.uploading = false;
    photo.error = true;
  }
  render();
}

function removePhoto(key, i){
  state.formData.items[key].photos.splice(i, 1);
  render();

function addCalRow(){

// ---------- submit ----------
async function submitForm(){
  const f = getForm(state.activeFormId);
  if (!f) return;
  const d = state.formData;

  if (f.template === 'machine') {
    if (!d.employeeSignature) { showToast('Please sign to acknowledge'); return; }
  } else {
    if (!d.overallResult) { showToast('Please select an overall result'); return; }
    const stillUploading = Object.values(d.items || {}).some(r => (r.photos||[]).some(p => p.uploading));
    if (stillUploading) { showToast('A photo is still uploading — please wait a moment'); return; }
  }

  // strip local-only preview data before saving; keep only successfully uploaded photo keys
  const cleanData = JSON.parse(JSON.stringify(d));
  if (cleanData.items) {
    Object.values(cleanData.items).forEach(r => {
      r.photos = (r.photos || []).filter(p => p.key).map(p => ({ key: p.key }));
    });
  }

  const payload = {
    formId: f.id,
    formTitle: f.title,
    formCode: f.code,
    template: f.template,
    department: f.dept || d.department || '',
    employeeName: state.employeeName,
    submittedAtLocal: new Date().toISOString(),
    data: cleanData
  };

  state.saving = true;
  showToast('Saving...');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    showToast('Checklist submitted ✓');
    state.activeFormId = null;
    state.screen = 'home';
    state.historyLoaded = false;
    render();
    loadHistoryIfNeeded();
  } catch (e) {
    console.error(e);
    showToast('Save failed — check connection and try again');
  }
  state.saving = false;
}

  state.screen = 'detail';
  render();
  window.scrollTo(0,0);
}

function detailItemLineHtml(k, rec){
  const photos = rec.photos || [];
  return `<li>
    <b>${esc(k.split('||')[1])}</b>${rec.comment ? ' — ' + esc(rec.comment) : ''}
    ${photos.length ? `<div class="photostrip" style="margin-top:6px;">${photos.map(p => `
      <a href="/api/photos/${esc(p.key)}" target="_blank"><div class="phothumb"><img src="/api/photos/${esc(p.key)}"></div></a>
    `).join('')}</div>` : ''}
  </li>`;
}

function detailHtml(){
  const i = state.detailItem;
  if (!i) return '<div class="empty">Not found.</div>';
  const f = getForm(i.formId);
  let body = '';
  if (i.template === 'machine') {
    body = `
    <div class="detailgrid">
      <div><b>Employee</b>${esc(i.data.employeeName)}</div>
      <div><b>Shift</b>${esc(i.data.shift)}</div>
      <div><b>Machine</b>${esc(i.data.machine)}</div>
      <div><b>Date</b>${esc(i.data.ackDate)}</div>
      <div><b>Employee Signature</b>${esc(i.data.employeeSignature)}</div>
      <div><b>Supervisor Signature</b>${esc(i.data.supervisorSignature||'—')}</div>
    </div>
    <ul class="safetylist">${(f?f.steps:[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
  } else {
    const items = i.data.items || {};
    const attnKeys = Object.keys(items).filter(k => items[k].status === 'ATTN');
    const notedKeys = Object.keys(items).filter(k => items[k].status !== 'ATTN' && (items[k].comment || (items[k].photos||[]).length));
    body = `
    <div class="detailgrid">
      <div><b>Inspected By</b>${esc(i.data.inspectedBy)}</div>
      <div><b>Date Inspected</b>${esc(i.data.dateInspected)}</div>
      ${Object.entries(i.data.header||{}).map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v)}</div>`).join('')}
      <div><b>Overall Result</b>${esc(RESULT_OPTIONS.find(r=>r.key===i.data.overallResult)?.label || '')}</div>
    </div>
    ${attnKeys.length ? `
      <div class="sectiontitle">Items Needing Attention</div>
      <ul class="safetylist">
        ${attnKeys.map(k => detailItemLineHtml(k, items[k])).join('')}
      </ul>` : `<p style="color:var(--text-mute);">No items were flagged as Needs Attention.</p>`}
    ${notedKeys.length ? `
      <div class="sectiontitle">Other Notes</div>
      <ul class="safetylist">
        ${notedKeys.map(k => detailItemLineHtml(k, items[k])).join('')}
      </ul>` : ''}
    ${(i.data.correctiveActions||[]).length ? `
      <div class="sectiontitle">Corrective Action Log</div>
      <table class="caltable">
        <tr><th>Item</th><th>Action</th><th>Assigned To</th><th>Due</th></tr>
        ${i.data.correctiveActions.map(r=>`<tr><td>${esc(r.item)}</td><td>${esc(r.action)}</td><td>${esc(r.assignedTo)}</td><td>${esc(r.dueDate)}</td></tr>`).join('')}
      </table>` : ''}`;
  }
  return `
  <div class="backlink" onclick="state.screen='history';render();">‹ Back to history</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <h2 style="margin:0 0 4px;">${esc(i.formTitle)}</h2>
        <div style="font-size:12.5px;color:var(--text-mute);">${esc(i.formCode)} &middot; Submitted by ${esc(i.employeeName)}</div>
      </div>
      <button class="btn ghost" onclick="window.print()">Print</button>
    </div>
  </div>
  <div class="card">${body}</div>`;
}

function exportHistoryCsv(){
  const rows = [['Form','Code','Employee','Submitted','Overall Result']];
  state.historyItems.forEach(i => {
    rows.push([
      i.formTitle, i.formCode, i.employeeName,
      i.submittedAtLocal ? new Date(i.submittedAtLocal).toLocaleString() : '',
      i.data && i.data.overallResult ? (RESULT_OPTIONS.find(r=>r.key===i.data.overallResult)?.label||'') : (i.template==='machine'?'Acknowledged':'')
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'safetytrack-history-' + todayStr() + '.csv';
  a.click();
}

function wireEvents(){
  const s = document.getElementById('searchInput');
  if (s) s.oninput = (e) => { state.search = e.target.value; render(); s.focus(); s.setSelectionRange(s.value.length, s.value.length); };
}

render();
if (state.employeeName) loadHistoryIfNeeded();
</script>


</body>
</html>
