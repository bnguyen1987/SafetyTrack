[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Orientation photos and icons rarely change: let phones keep them for a day instead of
# re-checking every picture on every visit. The app itself (index.html) is never cached.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
